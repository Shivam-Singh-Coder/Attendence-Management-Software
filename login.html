<html>
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html{
                font-size: 10px;
            }
            body {
                font-family: Arial, Helvetica, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: pink;
            }
            .d1{
                /* border: 2px solid black; */
                display: flex;
                justify-content: center;
                align-items: center;
                width: 80%;
                height: 40rem;
            }
            .d2{
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-direction: row-reverse;
                width: 100%;
                height: 100%;
                background-color: red;
                border-radius: 6px;

            }
            .d3{
                background-color: white;
                border-top-left-radius: 5px;
                border-bottom-left-radius: 5px;
                width: 50%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .d3 h1{
                /* position: relative; */
                font-size: 4rem;
                text-align: center;
                font-weight: 900;
            }
            .d4{
                margin-top: 5%;
                width: 100%;
            }
            table{
                width: 100%;
                text-align: center;
                border-collapse: collapse;
            }
            table td{
                position: relative;
                height: 6rem;
                /* border: solid 1px red; */
            }
            table td input{
                width: 80%;
                height: 4rem;
                padding-left: 3rem;
                border: none;
                border-radius: 0.5rem;
                background-color: rgb(231, 228, 228);
            }
            table td i{
                position: absolute;
                left: 12%;
                top: 38%;
            }
            .d6{
                color: gray;
            }
            .b1{
                border-radius: 50px;
                padding: 1rem 3rem;
                background-color: orangered;
                color: white;
                font-weight: bolder;
                border: none;
                
            }
            .d7{
                font-weight: bolder;
                width: 50%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: space-evenly;
                align-items: center;
            }
            .d7 h1{
                color: white;
                text-align: center;
            }
            .d7 p{
                color: white;
                text-align: center;
                line-height: 1.5rem;
                word-spacing: 4px;
                margin-top: -8rem;
            }
            .d7 .b1{
                border: solid 1px white;
                margin-top: -8rem;
                letter-spacing: 0.1rem;
            }
            @media (max-width:998px) {
                html{
                    font-size:55%;
                }
            }
            @media (max-width:768px) {
                html{
                    font-size:45%;
                }
            }
            @media (max-width:600px) {
                html{
                    font-size:35%;
                }
                table{
                    font-size: 2rem;
                }
                table input{
                    font-size: 2rem;
                }
                table .b1{
                    font-size: 2rem;
                }
                .d7 .b1{
                    font-size: 1.5rem;
                    font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                }
            }
        </style>
    </head>
    <body>
        <div class="d1">
            <div class="d2">
                <div class="d7">
                    <h1>Student Management <br>Software</h1>
                    <p>This loging form is created using pure <br>HTML and CSS For social icons,<br>Font Awsome is used</p>
                    <button class="b1">Sign Up</button>
                </div>
                <div class="d3">
                    <h1>Login</h1>
                    <div class="d4">
                        <table>
                            <tr>
                                <td>
                                    <i class="fa fa-user u1"></i>
                                    <input type="email"  placeholder="Email">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <i class="fa fa-user u2"></i>
                                    <input type="password" placeholder="Password">
                                </td>
                            </tr>
                            <tr>
                                <td>Forget your password?</td>
                            </tr>
                            <tr>
                                <td align="center">
                                    <button class="b1">LOG IN</button>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
