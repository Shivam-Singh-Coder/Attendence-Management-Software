<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashbord</title>
        <link rel="icon" href="Attendance.png">
        <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        } 
        html{
            font-size: 10px;
        }
        body{
            background-color: #EBF3E8;
        }
        .main{
            position: relative;
            width: 100%;
            height: 100vh;
        }
        .nv{
            height: 8rem;
            width: 100%;
            /* border: 2px solid black; */
            background-color:#86A789;
            box-shadow: 5px 5px 5px 5px;
        }
        .pop{
            position: absolute;
            height: 10rem;
            width: 15rem;
            right: 10rem;
            top: 6.5rem;
            background-color: aliceblue;
            visibility: hidden;
            z-index: 1;
            border-radius: 1rem;  
        }
        .pop div{
            width: 100%;
            height: 50%;
            font-size: 2rem;
            text-align: center;
            padding: 1rem;
            border-bottom: 1px solid black;
            cursor: pointer;
        }
        .pop div:hover{
            font-size: 2.5rem;
            color: blue;
            transition: 0.3s;
        }
        .s1{
            font-size: 4rem;
            font-weight: bolder;
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            letter-spacing: 1px;           
        }
        .name{
            position: absolute;
            font-size: 2.5rem;
            top: 2.5rem;
            font-weight: bold;
            right: 9rem;
            cursor: pointer;
        }
        .box1{
            width: 10%;
            height: 10%;
            text-align: center;
            position: absolute;
            right: 12rem;
            top: 25rem;
        }
        .box1 button{
            border-radius: 10px;
            padding: 1rem 1.5rem;
            font-size: 1.5rem;
            background-color: #a3c8a6;
            border: none;
        }
        
        .t1{
            width: 98%;
            margin: auto;
            margin-top: 2%;
            text-align: center;border: solid 1px gray;padding: 1rem;
            border-radius: 0.5rem;
        }
        caption{
            font-size: 2.5rem;
            color: blue;
            margin-bottom: 1rem;
        }
        .t1 td{
            font-size: 2rem;
            width: 25%;
        }
        .t1 input{
            font-size: 2rem;
            width: 70%;
            height: 60%;
            border-radius: 0.5rem;
            border: solid 1px blue;
            padding:1rem;
        }
        input[type="checkbox"]{
            height: 50%;
            width: 50%;
        }
        .t1 button{
            border-radius: 10px;
            padding: 1rem 1.5rem;
            font-size: 1.5rem;
            background-color: #0dbeeb;
            border: none;
            color: white;
            cursor: pointer;
        }
        .report{
            margin: auto;
            margin-top: 2rem;
            width: 98%;
            border-radius: .5rem;
            padding: 1rem;
            /* right: 0rem; */
            /* top: 8rem; */
            /* height: 35%; */
        }
        .show{
            /* height: 80%; */
            width: 90%;
            font-size: 2rem;
            margin: auto;
            /* border: 2px solid black; */
            border-collapse: collapse;
        }
        .show th{
            background-color: rgb(101, 204, 245);
            color: white;
        }
        .show tr, .show td, .show th{
            border: 1px solid black;
            text-align: center;
            padding: 0.2rem;
        }
        #graph{
            border: solid 1px gray;
            width: 50%;
            margin: auto;
            margin-top: 2rem;
            border-radius: 0.5rem;
        }
        #graph canvas{
            margin: auto;
        }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="nv" style="color: white;">
                <span class="s1">Dashboard</span>
                <span class="name">&nbsp;<i class="fa-solid fa-user"></i> &nbsp;Pranav Raj &nbsp;&nbsp;<i class="fa-solid fa-caret-down fa-sm" style="color: rgb(252, 18, 57);" id="ns"></i></span>
                <div class="pop" style="color: black;">
                    <div onclick="location.href='Profile_Page.html'">Profile</div>
                    <div id="logout">Logout</div>
                </div>
            </div>
            <table class="t1">
                <caption>Mark Attendence</caption>
                <tr>
                    <td>
                        <input type="datetime-local" id="date">
                    </td>
                    <td> 
                        <input type="checkbox">
                    </td>
                    <td>
                        <button class="submit">Submit</button>
                        <button class="view" style="margin-left: 5%;">View Report</button>
                    </td>
                </tr>
            </table>
            <div class="report"></div>
            <div id="graph">
                <canvas id="myChart" style="width:100%;max-width:600px"></canvas>
            </div>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            var uname,utype,email,cd;
            $(document).ready(function(){
                uname=sessionStorage.getItem('uname');
                email=sessionStorage.getItem('email');
                utype=sessionStorage.getItem('utype');
                if(utype=='Administrator'){
                    $('.t1').css('display','none');
                    $.ajax({
                        method:'post',
                        url:'attendence.py',
                        data:{},
                        success:function(data){
                            data=data.split('     ');
                            $('.report').html(data[0]);
                            $('.report').css('border','solid 1px gray');
                            if(data[1]!=undefined){
                                var j=data[1].split('&&');
                                chart('Student','Employee',j[0],j[1]);
                            }
                        }
                    })
                }
                else
                    record();
                dat();
                $('.name').html('&nbsp;<i class="fa-solid fa-user"></i> &nbsp;'+uname+'&nbsp;&nbsp;<i class="fa-solid fa-caret-down fa-sm" style="color: rgb(252, 18, 57);" id="ns"></i>');             
                $('.name').click(function(){
                    
                    if($('.pop').css('visibility')=='hidden'){
                        $('.pop').css({'visibility':'visible'})
                    }
                    else{
                        $('.pop').css({'visibility':'hidden'})
                    }
                })
                $('.view').click(function(){
                    record();
                })
                $('#logout').click(function(){
                    window.location.href='index.html';
                    sessionStorage.removeItem('uname');
                    sessionStorage.removeItem('email');
                    sessionStorage.removeItem('utype');
                })
                $('.submit').click(function(){
                    $('.show').css({'visibility':'visible'});
                    if($('input[type="checkbox"]').prop('checked')==true && $('#date').val()!=''){
                        $.ajax({
                            method:'post',
                            url:'attendence.py',
                            data:{
                                cond:'report_sub',
                                t1:utype.trim(),
                                t2:email.trim(),
                                t3:$('#date').val().split('T')[0],
                                t4:$('input[type="datetime-local"]').val(),
                            },
                            success:function(data){
                                alert(data)
                            }
                        })
                    }
                    else{
                        alert("Please Check All Filed!!")
                    }
                })
            })
            function chart(a,b,c,d){
                const xValues = [a, b];
                const yValues = [c, d];
                const barColors = ["#b91d47","#00aba9"];

                new Chart("myChart", {
                    type: "pie",
                    data: {
                        labels: xValues,
                        datasets: [{
                        backgroundColor: barColors,
                        data: yValues
                        }]
                    },
                    options: {
                        title: {
                        display: true,
                        text: "Attendence Report"
                        }
                    }
                });
            }
            function record(){
                $.ajax({
                    method:'post',
                    url:'attendence.py',
                    data:{
                        cond:'report_run',
                        t1:utype.trim(),
                        t2:email.trim()
                    },
                    success:function(data){
                        data=data.split('     ');
                        $('.report').html(data[0]);
                        $('.report').css('border','solid 1px gray');
                        if(data[1]!=undefined){
                            var j=data[1].split('&&');
                            chart('Absent','Present',j[0],j[1]);
                        }
                    }
                })
            }
            function dat(){
                let dt=new Date();
                let dd=String(dt.getDate());
                let yy=dt.getFullYear();
                let mm=String(dt.getMonth());
                let th=dt.getHours();
                let tm=dt.getMinutes();
                let ts=dt.getSeconds();
                if(dd.startsWith('0',0));
                else{
                if(dd<10)
                    dd="0"+dd
                }
                if(mm.startsWith('0',0));
                else{
                if(mm<10)
                    mm="0"+mm
                }
                cd=yy+'-'+mm+'-'+dd+'T'+th+':'+tm;
                $('#date').val(cd);
                $('#date').attr('max',cd);
            }
        </script>    
    </body>
</html>
