<body>
    <div class="container">
        <div class="row gutters">
            <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12 col-12" style="margin: auto;">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="row gutters">
                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                                <h6 class="mb-2 text-primary">Personal Details</h6>

                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                                <div class="form-group">
                                    <label for="User Id">Name</label>
                                    <input type="text" class="form-control" id="UserId" placeholder="Enter Name" disabled>
                                </div>
                            </div>
                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12" style="margin-bottom: -2rem;">

                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12" style="margin-bottom:-2rem;">
                                <div class="form-group">
                                    <label for="Content no">Contact no</label>
                                    <input type="text" class="form-control" id="contno"
                                        placeholder="Enter contact number" maxlength="10" minlength="10"
                                        inputmode="numeric" disabled>
                                    <!-- <span id="nnn" style="color:red;" ></span> -->
                                    <span id="cont" style="color:red;margin-left: 15rem;"></span>
                                </div>
                            </div>
                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                                <div class="form-group">
                                    <label for="DOB">DOB</label>

                                </div>
                            </div>
                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                                <div class="form-group">
                                    <label for="gender">Gender</label> &nbsp;&nbsp;&nbsp;&nbsp;
                                    <!-- <input type="text" class="form-control" id="dob" placeholder="Date of birth"> -->
                                    <input type="radio" name="rad" value="Male" id="m" checked><label for="m">&nbsp;Male</label>&nbsp;&nbsp;&nbsp;
                                    <input type="radio" name="rad" value="Female" id="f"><label for="f">&nbsp;Female</label>&nbsp;&nbsp;&nbsp;
                                    <input type="radio" name="rad" value="Binary" id="b"><label for="b">&nbsp;Binary</label>
                                </div>
                            </div>

                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">

                            </div>
                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">

                                </div>
                            </div>
                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">

                            </div>

                                <div class="form-group">

                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                                <div class="text-right">
                                    <button type="button" id="submit" name="submit"
                                        class="btn btn-primary">Update</button>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>
    <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
        var email,uname,flag=true;
        $(document).ready(function () {
            email=sessionStorage.getItem('email');
            uname=sessionStorage.getItem('uname');
            $('#email').val(email);
            $('#UserId').val(uname);
            date();
            $.ajax({
                method:'post',
                url:'attendence.py',
                data:{
                    cond:'profile_run',
                    t1:email.trim(),
                },
                success:function(data){
                    let jk=data.split('&&');
                    $('#contno').val(jk[0]);
                    if(jk[5].trim()!='None')
                        $('#dob').val(jk[5].trim());
                    if(jk[6].trim()!='None')
                    $('input[name="rad"][value="'+jk[6].trim()+'"]').prop('checked',true);
                    if(jk[7].trim()!='None')
                        $('#State').val(jk[7].trim());
                    if(jk[8].trim()!='None')
                        $('#Distric').val(jk[8].trim());
                    if(jk[9].trim()!='None')
                        $('#pincode').val(jk[9].trim());
                    if(jk[10].trim()!='None')
                        $('#loc').val(jk[10].trim());
                    if(jk[11].trim()!='None')
                        $('#abo').val(jk[11].trim());
                }   
            })
            $('#submit').click(function(){
                flag=true;
                if(flag){
                    if(confirm('Do You want to update your record!!')){
                        $.ajax({
                            method:'post',
                            url:'attendence.py',
                            data:{
                                cond:'update',
                                t1:$('#UserId').val(),
                                t2:$('#email').val(),
                                t3:$('#contno').val(),
                                t4:$('#dob').val(),
                                t5:$('input[name="rad"]:checked').val(),
                                t6:$('#State').val(),
                                t7:$('#Distric').val(),
                                t8:$('#pincode').val(),
                                t9:$('#loc').val(),
                                t10:$('#abo').val()
                            },
                            success:function(data){
                                data=data.split('&&')
                                alert(data[0]);
                                if(data[1]==0)
                                    location.reload();
                            }
                        });
                    }
                }
            })
            function date(){
                    let dt=new Date();
                    let dd=String(dt.getDate());
                    let yy=dt.getFullYear();
                    let mm=String(dt.getMonth());
                    let th=dt.getHours();
                    let tm=dt.getMinutes();
                    let ts=dt.getSeconds();
                    if(dd.startsWith('0',0));
                    else{
                    if(dd<10)
                        dd="0"+dd
                    }
                    if(mm.startsWith('0',0));
                    else{
                    if(mm<10)
                        mm="0"+mm
                    }
                    cd=yy+'-'+mm+'-'+dd;
                    $('#dob').val(cd);
                    $('#dob').attr('max',cd);
            }
        });
    </script>
